[project]
name = "neo_engineering"
authors = [
    { name = "Alwathaeq Engineering Consultancy Office" },
]
description = "NeoEngineering app for ERPNext / Frappe v15"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # frappe and erpnext are bench-managed; do not pin here
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501"]
